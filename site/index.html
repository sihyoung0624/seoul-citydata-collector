<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 어디가?</title>
<meta name="description" content="서울 121개 장소의 지금 혼잡도를 평소와 비교하고, 예측의 신뢰도까지 알려드립니다">
<style>
  :root {
    --bg: #F4F6F5; --card: #FFFFFF; --ink: #1E2522; --muted: #5C6662; --line: #E2E7E4;
    --easy: #188A66; --normal: #C29A1B; --busy: #C7702E; --crowded: #C6403D;
    --accent: #0F6B52;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131514; --card: #1C1E1D; --ink: #E8EAE8; --muted: #9AA39E; --line: #2E3330;
      --easy: #2AA47C; --normal: #D1A832; --busy: #D6854A; --crowded: #D95C55;
      --accent: #3AAE8C;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    font-size: 17px; line-height: 1.6;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  header h1 { font-size: 28px; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }

  .picker { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  select {
    width: 100%; font-size: 18px; padding: 14px 12px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button {
    font-size: 15px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  }
  .chips button:hover { border-color: var(--accent); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 14px; }
  .card h2 { font-size: 22px; margin: 0 0 2px; }
  .when { font-size: 13.5px; color: var(--muted); }
  .stale { color: var(--busy); font-weight: 700; }

  .nowline { display: flex; align-items: center; gap: 12px; margin: 14px 0 6px; flex-wrap: wrap; }
  .lvl { font-size: 20px; font-weight: 800; padding: 8px 16px; border-radius: 10px; color: #fff; }
  .lvl.l1 { background: var(--easy); } .lvl.l2 { background: var(--normal); }
  .lvl.l3 { background: var(--busy); } .lvl.l4 { background: var(--crowded); }
  .pp { font-size: 18px; font-variant-numeric: tabular-nums; }

  .vs { font-size: 17px; margin: 10px 0 0; padding: 12px 14px; border-radius: 10px;
    background: var(--bg); }
  .vs b.up { color: var(--crowded); } .vs b.down { color: var(--easy); } .vs b.same { color: var(--muted); }

  .sect { font-size: 14px; font-weight: 800; color: var(--muted); letter-spacing: .04em;
    margin: 0 0 10px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
  .bars .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    align-items: stretch; height: 100%; }
  .bars .bar { border-radius: 4px 4px 0 0; min-height: 4px; }
  .bars .b1 { background: var(--easy); } .bars .b2 { background: var(--normal); }
  .bars .b3 { background: var(--busy); } .bars .b4 { background: var(--crowded); }
  .xlab { display: flex; gap: 4px; margin-top: 6px; }
  .xlab span { flex: 1; text-align: center; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }

  .score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .score .big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .grade { font-size: 15px; font-weight: 700; padding: 4px 12px; border-radius: 999px; color: #fff; }
  .g-good { background: var(--easy); } .g-mid { background: var(--normal); } .g-low { background: var(--crowded); }
  .score-note { font-size: 14px; color: var(--muted); margin-top: 8px; }

  .tip { font-size: 14.5px; color: var(--muted); background: var(--bg); border-radius: 10px;
    padding: 10px 14px; margin-top: 4px; }
  footer { font-size: 12.5px; color: var(--muted); margin-top: 28px; line-height: 1.8; }
  footer a { color: var(--accent); }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>서울 어디가?</h1>
    <p>지금 혼잡도를 <b>평소와 비교</b>하고, 그 장소 <b>예측의 신뢰도</b>까지 알려드려요</p>
  </header>

  <div class="picker">
    <select id="areaSelect" aria-label="장소 선택"><option value="">장소를 선택하세요</option></select>
    <div class="chips" id="chips"></div>
  </div>

  <div id="view"><p class="loading">데이터를 불러오는 중…</p></div>

  <footer>
    출처: 서울 열린데이터광장 「서울 실시간 도시데이터」(공공누리 제1유형) ·
    인구는 2,000명 폭 추정 구간이며, 혼잡 단계는 그 장소의 평소 대비 상대값입니다.<br>
    신뢰도는 <a href="https://claude.ai/code/artifact/717e7e2f-53a3-4797-8446-5c32c252124c" target="_blank" rel="noopener">90일간 예측 13.7만 건을 채점한 결과</a>에서 계산했습니다 ·
    <a href="https://github.com/sihyoung0624/seoul-citydata-collector" target="_blank" rel="noopener">수집기 코드</a> ·
    <span id="builtAt"></span>
  </footer>
</div>

<script>
const LVL = { '여유': 1, '보통': 2, '약간 붐빔': 3, '붐빔': 4 };
const POPULAR = ['POI007', 'POI014', 'POI009', 'POI105', 'POI003', 'POI119'];
const DOW = ['', '월', '화', '수', '목', '금', '토', '일'];
let areas = [], current = null, patterns = null, reliability = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => Number(n).toLocaleString('ko-KR');

async function load() {
  try {
    const [a, c, p, r, m] = await Promise.all(
      ['areas', 'current', 'patterns', 'reliability', 'meta'].map((f) =>
        fetch('data/' + f + '.json').then((x) => { if (!x.ok) throw new Error(f); return x.json(); })));
    areas = a; current = c; patterns = p; reliability = r;
    $('builtAt').textContent = '갱신: ' + new Date(m.built_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    initPicker();
    const hash = location.hash.replace('#', '');
    render(areas.some((x) => x.cd === hash) ? hash : 'POI007');
  } catch (e) {
    $('view').innerHTML = '<p class="loading">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>';
  }
}

function initPicker() {
  const sel = $('areaSelect');
  const cats = [...new Set(areas.map((a) => a.cat))];
  for (const cat of cats) {
    const g = document.createElement('optgroup'); g.label = cat;
    for (const a of areas.filter((x) => x.cat === cat)) {
      const o = document.createElement('option'); o.value = a.cd; o.textContent = a.nm;
      g.appendChild(o);
    }
    sel.appendChild(g);
  }
  sel.addEventListener('change', () => sel.value && render(sel.value));
  for (const cd of POPULAR) {
    const a = areas.find((x) => x.cd === cd); if (!a) continue;
    const b = document.createElement('button'); b.textContent = a.nm.replace(/ 관광특구| 한강공원/, '');
    b.addEventListener('click', () => render(cd));
    $('chips').appendChild(b);
  }
}

function kstParts(iso) {
  const d = new Date(iso);
  const k = new Date(d.getTime() + 9 * 3600 * 1000);
  return { dow: (k.getUTCDay() === 0 ? 7 : k.getUTCDay()), hour: k.getUTCHours(),
           hhmm: String(k.getUTCHours()).padStart(2, '0') + ':' + String(k.getUTCMinutes()).padStart(2, '0') };
}

function render(cd) {
  const area = areas.find((a) => a.cd === cd); if (!area) return;
  $('areaSelect').value = cd;
  history.replaceState(null, '', '#' + cd);
  const cur = current.areas[cd];
  const parts = [];

  // ① 지금
  if (!cur) {
    parts.push(`<div class="card"><h2>${esc(area.nm)}</h2><p>최근 수집 데이터가 없습니다. 잠시 후 다시 확인해 주세요.</p></div>`);
  } else {
    const t = kstParts(cur.ppltn_time);
    const ageMin = Math.round((Date.now() - new Date(cur.ppltn_time).getTime()) / 60000);
    const stale = ageMin > 180 ? ' <span class="stale">(수집 지연 중)</span>' : '';
    const mid = (cur.min + cur.max) / 2;

    // ② 평소 대비
    let vsHtml = '';
    const slot = patterns[cd] && patterns[cd][t.dow + '-' + t.hour];
    if (slot && slot.n >= 3 && slot.mid > 0) {
      const diff = Math.round((mid - slot.mid) / slot.mid * 100);
      const word = diff >= 10 ? `<b class="up">${diff}% 붐벼요</b>` : diff <= -10 ? `<b class="down">${-diff}% 한산해요</b>` : '<b class="same">비슷해요</b>';
      vsHtml = `<div class="vs">평소 ${DOW[t.dow]}요일 ${t.hour}시(${fmt(slot.mid)}명)보다 ${word}</div>`;
    } else {
      vsHtml = `<div class="vs"><b class="same">평소 비교는 표본이 더 쌓이면 제공돼요</b></div>`;
    }

    parts.push(`<div class="card">
      <h2>${esc(area.nm)}</h2>
      <div class="when">${t.hhmm} 수집 기준${stale}</div>
      <div class="nowline"><span class="lvl l${LVL[cur.lvl] || 1}">${esc(cur.lvl)}</span>
        <span class="pp">${fmt(cur.min)} ~ ${fmt(cur.max)}명</span></div>
      ${vsHtml}
    </div>`);
  }

  // ③ 12시간 예측
  const fc = (current.forecasts[cd] || []).slice(0, 12);
  if (fc.length) {
    const maxMid = Math.max(...fc.map((f) => (f.min + f.max) / 2));
    const bars = fc.map((f) => {
      const h = Math.max(6, Math.round((f.min + f.max) / 2 / maxMid * 100));
      return `<div class="col" title="${kstParts(f.t).hour}시 ${esc(f.lvl)} ${fmt(f.min)}~${fmt(f.max)}명"><div class="bar b${LVL[f.lvl] || 1}" style="height:${h}%"></div></div>`;
    }).join('');
    const labs = fc.map((f) => `<span>${kstParts(f.t).hour}시</span>`).join('');
    parts.push(`<div class="card"><p class="sect">앞으로 12시간 예측 (서울시 발표)</p>
      <div class="bars">${bars}</div><div class="xlab">${labs}</div>
      <div class="legend"><span><i style="background:var(--easy)"></i>여유</span><span><i style="background:var(--normal)"></i>보통</span><span><i style="background:var(--busy)"></i>약간 붐빔</span><span><i style="background:var(--crowded)"></i>붐빔</span></div>
    </div>`);
  }

  // ④ 이 장소 예측의 신뢰도
  const rel = reliability.areas[cd];
  const ov = reliability.overall;
  if (rel) {
    const g = rel.exact >= 80 ? ['매우 믿을 만해요', 'g-good'] : rel.exact >= 68 ? ['믿을 만한 편이에요', 'g-good'] :
              rel.exact >= 55 ? ['참고만 하세요', 'g-mid'] : ['걸러 들으세요', 'g-low'];
    parts.push(`<div class="card"><p class="sect">이 장소 예측, 믿어도 될까?</p>
      <div class="score"><span class="big">${rel.exact}%</span><span class="grade ${g[1]}">${g[0]}</span></div>
      <div class="score-note">최근 90일간 이 장소의 예측 ${fmt(rel.n)}건을 실측과 대조한 적중률입니다
        (서울 121곳 평균 ${ov.exact}%)</div>
      <div class="tip">💡 서울시 예측은 <b>3시간 앞</b>이 가장 정확해요. 출발 3시간 전에 다시 확인하세요.
        "붐빔" 예보는 실제보다 과장되는 경향이 있어요.</div>
    </div>`);
  }

  $('view').innerHTML = parts.join('');
}

load();
</script>
</body>
</html>
