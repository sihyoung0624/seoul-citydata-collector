# "서울 어디가?" 사이트 발행
#
# - 매시 33분(UTC): current 데이터만 갱신해 재배포
# - 일요일 02:41(UTC): 패턴·신뢰도 포함 전체 재계산
# - 수동 실행: 기본 full
#
# 배포 방식: GitHub Pages (Actions 소스). site/ 폴더를 그대로 올린다.
# DB 접근은 빌더(site-build.js)가 Secrets의 키로만 수행 — 사이트에는 키가 없다.

name: site

on:
  schedule:
    - cron: '33 * * * *'
    - cron: '41 2 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: '빌드 모드'
        type: choice
        options: [full, current]
        default: full

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 사이트 데이터 생성
        run: node src/site-build.js "$MODE"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '41 2 * * 0' && 'full' || 'current') }}

      - name: Pages 설정
        uses: actions/configure-pages@v4

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
