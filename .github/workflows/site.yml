# "서울 어디가?" 사이트 발행
#
# - 매시 33분(UTC): current 데이터만 갱신해 재배포
# - 일요일 02:41(UTC): 패턴·신뢰도 포함 전체 재계산
# - 수동 실행: 기본 full
#
# 배포 방식: GitHub Pages (Actions 소스). site/ 폴더를 그대로 올린다.
# DB 접근은 빌더(site-build.js)가 Secrets의 키로만 수행 — 사이트에는 키가 없다.

name: site

on:
  schedule:
    - cron: '33 * * * *'
    - cron: '41 2 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: '빌드 모드'
        type: choice
        options: [full, current]
        default: full

permissions:
  contents: write   # gh-pages 브랜치 푸시용

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 사이트 데이터 생성
        run: node src/site-build.js "$MODE"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '41 2 * * 0' && 'full' || 'current') }}

      # 2026-11-25: 아티팩트 방식(deploy-pages)이 원인 불명으로 연속 실패하여
      # 검증된 브랜치 배포 방식으로 전환. gh-pages 브랜치는 생성물 전용(이력 없음, 강제 푸시)
      - name: gh-pages 브랜치로 배포
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
